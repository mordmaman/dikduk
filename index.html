// ---- hebrew.js ----
// Hebrew text analysis. Pure functions, no DOM, so tests/check.js can use them.
//
// A "letter" is one consonant plus the combining marks that follow it
// (vowels, dagesh, shin/sin dot, meteg, cantillation). Letter positions count
// consonants only, starting at 0, across the whole string. Spaces, makaf and
// punctuation are not letters.

const HEB_CONSONANT = /^[א-ת]$/;
// Combining marks that attach to the preceding consonant.
// Excludes makaf (05BE), paseq (05C0), sof pasuq (05C3), nun hafukha (05C6).
// Includes the combining grapheme joiner (034F), which some sources put
// between two vowel marks on one letter.
const HEB_POINT = /^[\u034F֑-ׇֽֿׁׂׅׄ]$/;
const HEB_WORD_BREAK = /^[\s־׀׃.,;:!?()"'\-]$/;

const VOWEL_NAMES = {
  'ְ': 'sheva',
  'ֱ': 'chataf-segol',
  'ֲ': 'chataf-patach',
  'ֳ': 'chataf-kamatz',
  'ִ': 'chirik',
  'ֵ': 'tzere',
  'ֶ': 'segol',
  'ַ': 'patach',
  'ָ': 'kamatz',
  'ֹ': 'cholam',
  'ֺ': 'cholam',
  'ֻ': 'kubutz',
  'ׇ': 'kamatz-katan',
};

const HEB_DOT = 'ּ';

// Split text into tokens: { kind: 'letter', base, text, marks, index, word, lastInWord }
// or { kind: 'other', text }. Joining every token's text gives back the input.
function splitHebrew(text) {
  const tokens = [];
  let letterIndex = 0;
  let wordIndex = 0;
  let current = null; // the letter currently collecting marks
  for (const ch of text) {
    // Presentation forms (e.g. U+FB35) decompose to base + marks for analysis.
    const decomposed = ch.normalize('NFD');
    const base = decomposed[0];
    if (HEB_CONSONANT.test(base)) {
      current = {
        kind: 'letter',
        base,
        text: ch,
        marks: [...decomposed.slice(1)],
        index: letterIndex++,
        word: wordIndex,
        lastInWord: false,
      };
      tokens.push(current);
    } else if (HEB_POINT.test(ch) && current) {
      current.text += ch;
      current.marks.push(ch);
    } else {
      current = null;
      const prev = tokens[tokens.length - 1];
      if (HEB_WORD_BREAK.test(ch) && prev && prev.kind === 'letter') wordIndex++;
      if (prev && prev.kind === 'other') prev.text += ch;
      else tokens.push({ kind: 'other', text: ch });
    }
  }
  const letters = tokens.filter((t) => t.kind === 'letter');
  letters.forEach((l, i) => {
    const next = letters[i + 1];
    const prev = letters[i - 1];
    l.lastInWord = !next || next.word !== l.word;
    // Previous letter in the same word, used to recognise vowel letters.
    Object.defineProperty(l, 'prev', { value: prev && prev.word === l.word ? prev : null, enumerable: false });
  });
  return tokens;
}

function lettersOf(text) {
  return splitHebrew(text).filter((t) => t.kind === 'letter');
}

// Names of the features a letter carries. The dot U+05BC is classified as:
//   shuruk  - in a vav that has no other vowel (וּ)
//   mappik  - in a he that ends its word (הּ)
//   dagesh  - everywhere else
function featuresOf(letter) {
  const f = new Set();
  const hasVowel = letter.marks.some((m) => VOWEL_NAMES[m] && m !== 'ְ');
  for (const m of letter.marks) {
    if (VOWEL_NAMES[m]) f.add(VOWEL_NAMES[m]);
    if (m === 'ׁ') f.add('shin-dot');
    if (m === 'ׂ') f.add('sin-dot');
    if (m === 'ֽ') f.add('meteg');
    if (m === 'ֿ') f.add('rafeh');
  }
  if (letter.marks.includes(HEB_DOT)) {
    if (letter.base === 'ו' && !hasVowel && !letter.marks.includes('ְ')) f.add('shuruk');
    else if (letter.base === 'ה' && letter.lastInWord) f.add('mappik');
    else f.add('dagesh');
  }
  if (isVowelLetter(letter, f)) f.add('vowel-letter');
  return f;
}

// A ה, ו or י that only shows a vowel and is not sounded as a consonant:
//   ו  with shuruk, or with cholam when the letter before has no vowel (תּוֹרָה)
//   י  with no marks of its own, after a chirik, tzere or segol (שִׁי, בֵּית)
//   ה  with no marks, ending a word, after a vowel (תּוֹרָה)
function isVowelLetter(letter, f) {
  const prevVowel = (l) => Boolean(l) && l.marks.some((m) => VOWEL_NAMES[m]);
  if (letter.base === 'ו') {
    if (f.has('shuruk')) return true;
    const ownVowels = letter.marks.filter((m) => VOWEL_NAMES[m]);
    return ownVowels.length === 1 && VOWEL_NAMES[ownVowels[0]] === 'cholam' && ownVowels[0] !== 'ֺ' && !prevVowel(letter.prev);
  }
  if (letter.base === 'י') {
    const before = letter.prev ? featuresOfMarks(letter.prev) : new Set();
    return letter.marks.length === 0 && ['chirik', 'tzere', 'segol'].some((v) => before.has(v));
  }
  if (letter.base === 'ה') return letter.marks.length === 0 && letter.lastInWord && prevVowel(letter.prev);
  return false;
}

function featuresOfMarks(letter) {
  return new Set(letter.marks.map((m) => VOWEL_NAMES[m]).filter(Boolean));
}

function hasFeature(letter, feature) {
  return featuresOf(letter).has(feature);
}

// Positions of every letter in text carrying a feature, e.g. 'dagesh'.
function positionsWith(text, feature) {
  return lettersOf(text)
    .filter((l) => hasFeature(l, feature))
    .map((l) => l.index);
}

// Strip every combining mark, leaving consonants and separators.
function consonantsOnly(text) {
  return splitHebrew(text)
    .map((t) => (t.kind === 'letter' ? t.base : t.text))
    .join('');
}

// Gap positions for a word split into parts. Gap g sits between letter g and
// letter g+1. ['הַ', 'מֶּלֶךְ'] gives [0].
function gapsForParts(parts) {
  const gaps = [];
  let count = 0;
  for (let i = 0; i < parts.length - 1; i++) {
    count += lettersOf(parts[i]).length;
    gaps.push(count - 1);
  }
  return gaps;
}

const FEATURE_NAMES = [
  'dagesh', 'shuruk', 'mappik', 'vowel-letter', 'sheva', 'shin-dot', 'sin-dot', 'meteg', 'rafeh',
  ...new Set(Object.values(VOWEL_NAMES)),
];

// ---- review.js ----
// Tracks questions answered wrongly, for the review mode (phase 2).
// A question joins the pool when answered wrongly and leaves it once it has
// been answered correctly twice.

const REVIEW_CLEAR_AFTER = 2;

const reviewKey = (lessonId, questionId) => `${lessonId}/${questionId}`;

function noteAnswer(save, lessonId, questionId, correct) {
  const key = reviewKey(lessonId, questionId);
  if (!correct) {
    save.missed[key] = { right: 0 };
  } else if (save.missed[key]) {
    save.missed[key].right += 1;
    if (save.missed[key].right >= REVIEW_CLEAR_AFTER) delete save.missed[key];
  }
  return save;
}

// Keys still in the pool whose question exists in the current lessons.
function reviewPool(save, lessons) {
  const live = new Set();
  for (const lesson of lessons) {
    for (const screen of lesson.teach) for (const q of screen.check || []) live.add(reviewKey(lesson.id, q.id));
    for (const q of lesson.test) live.add(reviewKey(lesson.id, q.id));
    for (const q of lesson.challenge || []) live.add(reviewKey(lesson.id, q.id));
  }
  return Object.keys(save.missed).filter((k) => live.has(k));
}

// ---- engine.js ----
// Runs a lesson as a list of steps. Pure logic, no DOM.



const STAR_THRESHOLD = 80;
const REVIEW_SIZE = 10;

// Answers are stored by step key. In a lesson that is the question id; in a
// review, which mixes lessons, it is "lessonId/questionId".
const stepKey = (step) => step.key ?? step.q.id;

// mode 'lesson': each teach screen, then its check questions, then the test.
// mode 'challenge': the challenge questions only.
function buildRun(lesson, mode = 'lesson') {
  const steps = [];
  if (mode === 'lesson') {
    for (const screen of lesson.teach) {
      steps.push({ kind: 'teach', screen });
      for (const q of screen.check || []) steps.push({ kind: 'question', phase: 'check', q });
    }
    steps.push({ kind: 'intro', phase: 'test', count: lesson.test.length });
    for (const q of lesson.test) steps.push({ kind: 'question', phase: 'test', q });
    steps.push({ kind: 'results', phase: 'test' });
  } else if (mode === 'challenge') {
    const qs = lesson.challenge || [];
    steps.push({ kind: 'intro', phase: 'challenge', count: qs.length });
    for (const q of qs) steps.push({ kind: 'question', phase: 'challenge', q });
    steps.push({ kind: 'results', phase: 'challenge' });
  } else {
    throw new Error(`unknown mode ${mode}`);
  }
  return { lessonId: lesson.id, mode, steps, index: 0, answers: {} };
}

// A review session: up to `size` questions from the pool of keys
// ("lessonId/questionId"), in random order, from any lesson.
function buildReviewRun(lessons, keys, size = REVIEW_SIZE, random = Math.random) {
  const found = new Map();
  for (const lesson of lessons) {
    const qs = [];
    for (const screen of lesson.teach) qs.push(...(screen.check || []));
    qs.push(...lesson.test, ...(lesson.challenge || []));
    for (const q of qs) found.set(reviewKey(lesson.id, q.id), { lesson, q });
  }
  const live = keys.filter((k) => found.has(k));
  const picked = shuffledIndexes(live.length, random).slice(0, size).map((i) => live[i]);
  const steps = [{ kind: 'intro', phase: 'review', count: picked.length }];
  for (const key of picked) {
    const { lesson, q } = found.get(key);
    steps.push({ kind: 'question', phase: 'review', q, key, lessonId: lesson.id });
  }
  steps.push({ kind: 'results', phase: 'review' });
  return { lessonId: null, mode: 'review', steps, index: 0, answers: {} };
}

const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));

// The correct response for a question, in the same shape the UI produces.
function correctResponse(q) {
  switch (q.type) {
    case 'choice':
    case 'wordbank':
    case 'predict':
      return q.options.findIndex((o) => o.correct === true);
    case 'truefalse':
      return q.answer;
    case 'tap':
      return [...q.answer];
    case 'match':
      return q.pairs.map((_, i) => i);
    case 'breakdown':
      return gapsForParts(q.parts.map((p) => p.he));
    default:
      throw new Error(`unknown type ${q.type}`);
  }
}

// response shapes:
//   choice / wordbank / predict: index of the chosen option (original order)
//   truefalse: boolean
//   tap: array of letter positions
//   match: array where response[leftIndex] = rightIndex (original pair order)
//   breakdown: array of gap positions
function grade(q, response) {
  const want = correctResponse(q);
  switch (q.type) {
    case 'tap':
    case 'breakdown':
      return Array.isArray(response) && sameSet(response, want);
    case 'match':
      return Array.isArray(response) && response.length === want.length && response.every((r, i) => r === i);
    default:
      return response === want;
  }
}

function answer(run, step, response) {
  const correct = grade(step.q, response);
  run.answers[stepKey(step)] = { response, correct, phase: step.phase };
  return correct;
}

function scoreRun(run) {
  const phase = run.mode === 'lesson' ? 'test' : run.mode;
  const qs = run.steps.filter((s) => s.kind === 'question' && s.phase === phase);
  const right = qs.filter((s) => run.answers[stepKey(s)]?.correct).length;
  const total = qs.length;
  const missedSteps = qs.filter((s) => !run.answers[stepKey(s)]?.correct);
  const missed = missedSteps.map((s) => s.q);
  return { phase, right, total, pct: total ? Math.round((right / total) * 100) : 0, missed, missedSteps };
}

// A question step must be answered before moving on.
function canAdvance(run) {
  const step = run.steps[run.index];
  if (!step || step.kind !== 'question') return run.index < run.steps.length - 1;
  return Boolean(run.answers[stepKey(step)]);
}

function progressFraction(run) {
  const last = run.steps.length - 1;
  return last <= 0 ? 1 : run.index / last;
}

// Fisher-Yates; returns a new array of original indexes.
function shuffledIndexes(n, random = Math.random) {
  const idx = [...Array(n).keys()];
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return idx;
}

function sortLessons(lessons) {
  return [...lessons].sort((a, b) => a.order - b.order);
}

function nextLesson(lessons, id) {
  const sorted = sortLessons(lessons);
  const i = sorted.findIndex((l) => l.id === id);
  return i >= 0 ? sorted[i + 1] || null : null;
}

// ---- save.js ----
// Progress saved in localStorage under one versioned key. Pure helpers plus a
// thin storage wrapper that never throws (storage can be missing or full).


const SAVE_KEY = 'dikduk.save';
const SAVE_VERSION = 1;

function defaultSave() {
  return {
    version: SAVE_VERSION,
    lessons: {}, // id -> { completed, bestTest, lastTest, attempts, bestChallenge, star }
    missed: {}, // "lessonId/questionId" -> { right } (questions to review)
    last: null, // id of the lesson most recently opened
    settings: { theme: 'auto', textSize: 'normal' },
  };
}

// Migrations from each old version to the next. migrations[n] turns version n
// into version n + 1. Add one here whenever SAVE_VERSION goes up, and add a
// fixture of the old shape to tests/fixtures/.
const migrations = {};

const THEMES = ['auto', 'light', 'dark'];
const SIZES = ['normal', 'large', 'larger'];
const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
const num = (v, d = 0) => (Number.isFinite(v) ? v : d);

// Accepts anything (parsed JSON, null, garbage) and returns a valid current save.
function migrate(data, steps = migrations) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return defaultSave();
  let d = { ...data };
  let v = Number.isInteger(d.version) ? d.version : 0;
  if (v > SAVE_VERSION) return defaultSave(); // written by a newer build; don't guess
  while (v < SAVE_VERSION) {
    const step = steps[v];
    if (!step) return defaultSave();
    d = step(d);
    v += 1;
  }
  return normalise(d);
}

// Fill in anything missing or malformed, keeping what is valid.
function normalise(d) {
  const out = defaultSave();
  for (const [id, l] of Object.entries(obj(d.lessons))) {
    const x = obj(l);
    out.lessons[id] = {
      completed: x.completed === true,
      bestTest: num(x.bestTest, null),
      lastTest: num(x.lastTest, null),
      attempts: num(x.attempts),
      bestChallenge: num(x.bestChallenge, null),
      star: x.star === true,
    };
  }
  for (const [key, m] of Object.entries(obj(d.missed))) out.missed[key] = { right: num(obj(m).right) };
  out.last = typeof d.last === 'string' ? d.last : null;
  const s = obj(d.settings);
  if (THEMES.includes(s.theme)) out.settings.theme = s.theme;
  if (SIZES.includes(s.textSize)) out.settings.textSize = s.textSize;
  return out;
}

function loadSave(storage = safeStorage()) {
  try {
    const raw = storage?.getItem(SAVE_KEY);
    return migrate(raw ? JSON.parse(raw) : null);
  } catch {
    return defaultSave();
  }
}

function writeSave(save, storage = safeStorage()) {
  try {
    storage?.setItem(SAVE_KEY, JSON.stringify(save));
    return true;
  } catch {
    return false;
  }
}

function safeStorage() {
  try {
    return globalThis.localStorage || null;
  } catch {
    return null;
  }
}

function lessonEntry(save, id) {
  if (!save.lessons[id]) {
    save.lessons[id] = { completed: false, bestTest: null, lastTest: null, attempts: 0, bestChallenge: null, star: false };
  }
  return save.lessons[id];
}

// Finishing the test completes the lesson whatever the score. Replaying never
// un-completes a lesson, lowers a best score or removes a star.
function recordResult(save, lessonId, phase, pct) {
  const e = lessonEntry(save, lessonId);
  if (phase === 'test') {
    e.completed = true;
    e.attempts += 1;
    e.lastTest = pct;
    e.bestTest = Math.max(e.bestTest ?? 0, pct);
  } else if (phase === 'challenge') {
    e.bestChallenge = Math.max(e.bestChallenge ?? 0, pct);
    if (pct >= STAR_THRESHOLD) e.star = true;
  }
  return save;
}

function resetProgress(save) {
  const fresh = defaultSave();
  fresh.settings = { ...save.settings };
  return fresh;
}

// ---- lesson-format.js ----
// The lesson file format, and the checks every lesson must pass.
//
// One file per lesson in src/lessons/, named NN-slug.js. The build picks up
// every file there automatically; nothing else needs editing. A lesson file
// contains a single default export and no imports:
//
// export default {
//   id: 'dagesh',            // unique, lowercase; stored in save data, so never rename it
//   order: 3,                // position in the course
//   title: 'Dagesh',
//   hebrewTitle: 'דָּגֵשׁ',   // optional
//   summary: 'One line shown in the lesson list.',
//   placeholder: false,      // optional; true shows a "placeholder" badge
//
//   teach: [                 // teaching screens, in order
//     {
//       id: 'two-jobs',
//       heading: 'One dot, two jobs',
//       body: ['A paragraph per string. **bold** and *italic* work.',
//              'Hebrew such as בָּרוּךְ is detected and set right-to-left automatically.'],
//       examples: [          // optional; shown large
//         { he: 'בָּרוּךְ', note: 'Where the learner meets this word',
//           mark: 'dagesh' }, // optional: underline letters with this feature,
//                             // or letters: [0, 2] to underline by position
//       ],
//       table: { headers: ['Word', 'Why'], rows: [['שַׁבָּת', 'Doubled']] }, // optional
//       callout: { kind: 'note', text: '...' },  // optional; kind is 'note' or 'tip';
//                                                // may also be a list of these
//       check: [ /* one or two questions, asked straight after this screen */ ],
//     },
//   ],
//   test: [ /* about ten questions; finishing them completes the lesson */ ],
//   challenge: [ /* optional harder questions; 80% or more earns a star */ ],
// };
//
// Every question has an id (unique within the lesson), a type, and an explain
// (shown after answering). Prompts and option text may mix English and Hebrew.
//
// { type: 'choice', prompt, he?, options: [{ text, correct?: true }], keepOrder?: true }
//     One option is correct. Options are shuffled unless keepOrder is set.
// { type: 'truefalse', statement, answer: true | false }
// { type: 'tap', prompt, he, answer: [positions], feature?: 'dagesh', all?: true }
//     Tap letters in he. Positions count consonants only, from 0, across the whole
//     phrase. If feature is given, every answer must carry it, and (unless all is
//     false) every letter carrying it must be in the answer. Features: see
//     FEATURE_NAMES in hebrew.js (dagesh, shuruk, mappik, sheva, kamatz, ...).
// { type: 'wordbank', prompt?, before, after, rtl?: true, options: [{ text, correct?: true }] }
//     Tap a word to fill the gap between before and after.
// { type: 'match', prompt?, pairs: [{ left, right }] }
//     Pair each left item with its right item. The right column is shuffled.
// { type: 'predict', prompt?, parts: ['הַ', '...'], options: [{ text, correct?: true }] }
//     Shown "part + part", pick the combined form.
// { type: 'breakdown', prompt?, he, parts: [{ he, label }] }
//     Tap where he splits. The parts joined must equal he exactly.


const QUESTION_TYPES = ['choice', 'truefalse', 'tap', 'wordbank', 'match', 'predict', 'breakdown'];
const ONE_CORRECT = ['choice', 'wordbank', 'predict'];

function allQuestions(lesson) {
  const out = [];
  for (const screen of lesson.teach || []) {
    for (const q of screen.check || []) out.push({ phase: 'check', q });
  }
  for (const q of lesson.test || []) out.push({ phase: 'test', q });
  for (const q of lesson.challenge || []) out.push({ phase: 'challenge', q });
  return out;
}

const isText = (v) => typeof v === 'string' && v.trim().length > 0;

function validateQuestion(q, where) {
  const errors = [];
  const err = (m) => errors.push(`${where}: ${m}`);
  if (!isText(q.id)) err('missing id');
  if (!QUESTION_TYPES.includes(q.type)) {
    err(`unknown type "${q.type}"`);
    return errors;
  }
  if (!isText(q.explain)) err('missing explain');

  if (ONE_CORRECT.includes(q.type)) {
    if (!Array.isArray(q.options) || q.options.length < 2) err('needs at least two options');
    else {
      const n = q.options.filter((o) => o.correct === true).length;
      if (n !== 1) err(`needs exactly one correct option, has ${n}`);
      if (q.options.some((o) => !isText(o.text))) err('an option has no text');
      const texts = q.options.map((o) => o.text);
      if (new Set(texts).size !== texts.length) err('duplicate option text');
    }
  }

  switch (q.type) {
    case 'choice':
      if (!isText(q.prompt)) err('missing prompt');
      break;
    case 'truefalse':
      if (!isText(q.statement)) err('missing statement');
      if (typeof q.answer !== 'boolean') err('answer must be true or false');
      break;
    case 'tap': {
      if (!isText(q.prompt)) err('missing prompt');
      if (!isText(q.he)) { err('missing he'); break; }
      const letters = lettersOf(q.he);
      if (!Array.isArray(q.answer) || q.answer.length === 0) { err('answer must list positions'); break; }
      if (new Set(q.answer).size !== q.answer.length) err('answer repeats a position');
      for (const p of q.answer) {
        if (!Number.isInteger(p) || p < 0 || p >= letters.length) err(`position ${p} is outside the text (${letters.length} letters)`);
      }
      if (q.feature !== undefined) {
        if (!FEATURE_NAMES.includes(q.feature)) err(`unknown feature "${q.feature}"`);
        for (const p of q.answer) {
          const l = letters[p];
          if (l && !hasFeature(l, q.feature)) err(`letter ${p} (${l.text}) does not carry ${q.feature}`);
        }
        if (q.all !== false) {
          const want = letters.filter((l) => hasFeature(l, q.feature)).map((l) => l.index);
          const missing = want.filter((p) => !q.answer.includes(p));
          if (missing.length) err(`answer leaves out letters carrying ${q.feature}: ${missing.join(', ')}`);
        }
      }
      break;
    }
    case 'wordbank':
      if (typeof q.before !== 'string' || typeof q.after !== 'string') err('needs before and after (either may be empty)');
      if (!isText(q.before) && !isText(q.after)) err('before and after are both empty');
      break;
    case 'match': {
      if (!Array.isArray(q.pairs) || q.pairs.length < 2) { err('needs at least two pairs'); break; }
      if (q.pairs.some((p) => !isText(p.left) || !isText(p.right))) err('a pair is missing left or right');
      const lefts = q.pairs.map((p) => p.left);
      const rights = q.pairs.map((p) => p.right);
      if (new Set(lefts).size !== lefts.length) err('duplicate left item');
      if (new Set(rights).size !== rights.length) err('duplicate right item');
      break;
    }
    case 'predict':
      if (!Array.isArray(q.parts) || q.parts.length < 2 || q.parts.some((p) => !isText(p))) err('needs at least two parts');
      break;
    case 'breakdown': {
      if (!isText(q.he)) { err('missing he'); break; }
      if (!Array.isArray(q.parts) || q.parts.length < 2) { err('needs at least two parts'); break; }
      if (q.parts.some((p) => !isText(p.he) || !isText(p.label))) err('a part is missing he or label');
      const joined = q.parts.map((p) => p.he).join('');
      if (joined !== q.he) err(`parts joined (${joined}) do not equal he (${q.he})`);
      if (splitHebrew(q.he).some((t) => t.kind === 'other')) err('he must be a single word');
      if (gapsForParts(q.parts.map((p) => p.he)).some((g) => g < 0)) err('a part has no letters');
      break;
    }
  }
  return errors;
}

function validateLesson(lesson, file = '') {
  const errors = [];
  const at = file || lesson?.id || 'lesson';
  const err = (m) => errors.push(`${at}: ${m}`);
  if (!lesson || typeof lesson !== 'object') return [`${at}: no default export`];
  if (!isText(lesson.id) || !/^[a-z0-9-]+$/.test(lesson.id)) err('id must be lowercase letters, digits and hyphens');
  if (!Number.isInteger(lesson.order)) err('order must be a whole number');
  if (!isText(lesson.title)) err('missing title');
  if (!isText(lesson.summary)) err('missing summary');
  if (!Array.isArray(lesson.teach) || lesson.teach.length === 0) err('needs at least one teach screen');
  if (!Array.isArray(lesson.test) || lesson.test.length === 0) err('needs test questions');
  if (lesson.challenge !== undefined && !Array.isArray(lesson.challenge)) err('challenge must be a list');

  const screenIds = new Set();
  (lesson.teach || []).forEach((s, i) => {
    const where = `teach[${i}]`;
    if (!isText(s.id)) err(`${where}: missing id`);
    else if (screenIds.has(s.id)) err(`${where}: duplicate screen id "${s.id}"`);
    screenIds.add(s.id);
    if (!isText(s.heading)) err(`${where}: missing heading`);
    if (!Array.isArray(s.body) || s.body.length === 0 || s.body.some((p) => !isText(p))) err(`${where}: body must be a list of paragraphs`);
    for (const ex of s.examples || []) {
      if (!isText(ex.he)) err(`${where}: example missing he`);
      if (ex.mark !== undefined && !FEATURE_NAMES.includes(ex.mark)) err(`${where}: unknown mark "${ex.mark}"`);
      if (ex.mark !== undefined && isText(ex.he) && !lettersOf(ex.he).some((l) => hasFeature(l, ex.mark))) {
        err(`${where}: example ${ex.he} has no letter carrying ${ex.mark}`);
      }
      const n = isText(ex.he) ? lettersOf(ex.he).length : 0;
      for (const p of ex.letters || []) if (!Number.isInteger(p) || p < 0 || p >= n) err(`${where}: example letter ${p} out of range`);
    }
    if (s.table) {
      const w = s.table.headers?.length;
      if (!w || !Array.isArray(s.table.rows) || s.table.rows.some((r) => r.length !== w)) err(`${where}: table rows must match headers`);
    }
    for (const c of s.callout ? [].concat(s.callout) : []) {
      if (!['note', 'tip'].includes(c.kind)) err(`${where}: callout kind must be note or tip`);
      if (!isText(c.text)) err(`${where}: callout has no text`);
    }
    if ((s.check || []).length > 2) err(`${where}: at most two check questions per screen`);
  });

  const qIds = new Set();
  for (const { phase, q } of allQuestions(lesson)) {
    const where = `${phase} ${q.id || '(no id)'}`;
    if (qIds.has(q.id)) err(`${where}: duplicate question id`);
    qIds.add(q.id);
    for (const e of validateQuestion(q, where)) errors.push(`${at}: ${e}`);
  }
  return errors;
}

// --- Text-level checks, run over the raw file text ---------------------------

// Divine names must never be printed in full. Returns the offending words.
// The patterns are written as escaped code points so this file does not print
// them either. Final letter forms are folded to their ordinary forms first.
const FINALS = { '\u05DA': '\u05DB', '\u05DD': '\u05DE', '\u05DF': '\u05E0', '\u05E3': '\u05E4', '\u05E5': '\u05E6' };
const NAME_YHWH = '\u05D9\u05D4\u05D5\u05D4';
const NAME_ELOK = /\u05D0\u05DC\u05D5?\u05D4\u05D9/; // Elokim and its forms, unaltered
const NAME_ELOAH = /\u05D0\u05DC\u05D5\u05D4$/; // Eloah, unaltered
const NAME_ADNY = '\u05D0\u05D3\u05E0\u05D9'; // the Name only with kamatz under the nun
const NAME_SHDY = '\u05E9\u05D3\u05D9'; // the Name only with shin dot and a dagesh in the dalet

function findDivineNames(text) {
  const found = [];
  const words = text.split(/[^֑-ׇא-תיִ-ﭏ]+/).filter(Boolean);
  for (const word of words) {
    const letters = lettersOf(word);
    const bare = letters.map((l) => FINALS[l.base] || l.base).join('');
    let hit = bare.includes(NAME_YHWH) || NAME_ELOK.test(bare) || NAME_ELOAH.test(bare);
    const adon = bare.indexOf(NAME_ADNY);
    if (adon !== -1 && hasFeature(letters[adon + 2], 'kamatz')) hit = true;
    const shad = bare.indexOf(NAME_SHDY);
    if (shad !== -1 && hasFeature(letters[shad], 'shin-dot') && hasFeature(letters[shad + 1], 'dagesh')) hit = true;
    if (hit) found.push(word);
  }
  return found;
}

// English spellings that break the house style. Maps the wrong form to the right one.
const BANNED_SPELLINGS = {
  shva: 'sheva', shewa: 'sheva', 'šewa': 'sheva', schwa: 'sheva',
  daghesh: 'dagesh', 'dagheš': 'dagesh', dagesch: 'dagesh',
  qamets: 'kamatz', qamats: 'kamatz', qames: 'kamatz', 'qameṣ': 'kamatz', kametz: 'kamatz',
  tsere: 'tzere', 'ṣere': 'tzere', sere: 'tzere',
  hiriq: 'chirik', hireq: 'chirik', 'ḥireq': 'chirik', hirik: 'chirik',
  seghol: 'segol',
  holem: 'cholam', holam: 'cholam',
  qibbuts: 'kubutz', qibbus: 'kubutz', kibbutz: 'kubutz',
  patah: 'patach', pathah: 'patach', pattah: 'patach',
  maqqeph: 'makaf', maqaf: 'makaf', maqqef: 'makaf',
  methegh: 'meteg', metheg: 'meteg',
  'mil’el': "mil'el",
};

function findBannedSpellings(text) {
  const found = [];
  const words = text.toLowerCase().match(/[a-zšṣḥ’']+/g) || [];
  for (const w of words) {
    const clean = w.replace(/^'+|'+$/g, '');
    if (BANNED_SPELLINGS[clean]) found.push(`${clean} -> ${BANNED_SPELLINGS[clean]}`);
  }
  return [...new Set(found)];
}

// ---- dom.js ----
// Small DOM helpers and text formatting.


// h('button', { class: 'x', onclick: fn }, 'text', child)
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  appendAll(el, children);
  return el;
}

function appendAll(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function clear(el) {
  while (el.firstChild) el.firstChild.remove();
  return el;
}

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);

// A run of Hebrew, allowing spaces, makaf and geresh inside it.
const HEB = '֑-״יִ-ﭏ\u034F';
const HEB_RUN = new RegExp(`[${HEB}]+(?:[\\s\\-]+[${HEB}]+)*`, 'g');

// English text with **bold**, *italic*, and Hebrew runs wrapped for RTL.
function formatText(s) {
  return escapeHtml(s)
    .replace(HEB_RUN, (m) => `<span class="he" lang="he" dir="rtl">${m}</span>`)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

const isHebrew = (s) => new RegExp(`[${HEB}]`).test(s);

// Trop (cantillation) marks. The main Hebrew font has none, so Hebrew that
// carries them is set in Noto Serif Hebrew, which has the trop and the vowels.
const hasTrop = (s) => /[\u0591-\u05AF]/.test(s);
function markTrop(root) {
  if (!root) return;
  for (const el of root.querySelectorAll('.he')) if (hasTrop(el.textContent)) el.classList.add('trop');
}

// Text node or element for a short label that may be Hebrew.
function textEl(tag, s, attrs = {}) {
  return h(tag, { ...attrs, html: formatText(s) });
}

// Hebrew word with chosen letters underlined (mark: feature name, or letters: positions).
function hebrewWithMarks(text, { mark, letters } = {}) {
  const wrap = h('span', { class: 'he', lang: 'he', dir: 'rtl' });
  for (const t of splitHebrew(text)) {
    const on = t.kind === 'letter' && ((mark && hasFeature(t, mark)) || (letters && letters.includes(t.index)));
    wrap.append(on ? h('span', { class: 'marked' }, t.text) : document.createTextNode(t.text));
  }
  return wrap;
}

function focusEl(el) {
  if (!el) return;
  if (!el.hasAttribute('tabindex') && !/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) el.setAttribute('tabindex', '-1');
  el.focus({ preventScroll: false });
}

// ---- questions.js ----
// One renderer per question type. Each returns:
//   el            the question's element
//   response()    the current response, or undefined if none yet
//   setResponse() restore a response (when revisiting an answered question)
//   reveal()      lock the question and show right / wrong / missed
// onChange is called whenever the response changes, so the caller can enable Check.




const RIGHT = '✓'; // ✓
const WRONG = '✗'; // ✗

function renderQuestion(step, onChange) {
  const q = step.q;
  const r = RENDERERS[q.type];
  if (!r) throw new Error(`no renderer for ${q.type}`);
  return r(q, step, onChange);
}

function promptEl(text) {
  return text ? textEl('p', text, { class: 'q-prompt' }) : null;
}

function bigHebrew(text) {
  return text ? h('div', { class: 'q-hebrew' }, hebrewWithMarks(text)) : null;
}

function statusTag(kind) {
  const label = { right: `${RIGHT} correct`, wrong: `${WRONG} your answer`, missed: 'correct answer' }[kind];
  return h('span', { class: `tag tag-${kind}` }, label);
}

// --- single choice: choice, truefalse, wordbank, predict ----------------------

function optionList(items, step, onChange, { keepOrder = false, cls = 'options' } = {}) {
  // items: [{ text }] in original order. Response = original index.
  if (!step.order) step.order = keepOrder ? items.map((_, i) => i) : shuffledIndexes(items.length);
  let chosen;
  const buttons = [];
  const list = h('div', { class: cls, role: 'group' });
  for (const i of step.order) {
    const b = h('button', { type: 'button', class: 'option', 'aria-pressed': 'false', 'data-i': i },
      h('span', { class: 'option-text', html: formatText(items[i].text) }));
    b.addEventListener('click', () => select(i));
    buttons[i] = b;
    list.append(b);
  }
  function select(i) {
    chosen = i;
    buttons.forEach((b, j) => b && b.setAttribute('aria-pressed', String(j === i)));
    onChange(i);
  }
  return {
    el: list,
    response: () => chosen,
    setResponse: (i) => select(i),
    reveal(want) {
      buttons.forEach((b, j) => {
        if (!b) return;
        b.disabled = true;
        if (j === want) { b.classList.add('right'); b.append(statusTag(j === chosen ? 'right' : 'missed')); }
        else if (j === chosen) { b.classList.add('wrong'); b.append(statusTag('wrong')); }
      });
    },
  };
}

function choice(q, step, onChange) {
  const opts = optionList(q.options, step, onChange, { keepOrder: q.keepOrder });
  const el = h('div', { class: 'q q-choice' }, promptEl(q.prompt), bigHebrew(q.he), opts.el);
  return { ...opts, el, reveal: () => opts.reveal(correctResponse(q)) };
}

function truefalse(q, step, onChange) {
  const items = [{ text: 'True' }, { text: 'False' }];
  const opts = optionList(items, step, (i) => onChange(i === 0), { keepOrder: true, cls: 'options options-row' });
  const el = h('div', { class: 'q q-truefalse' }, textEl('p', q.statement, { class: 'q-prompt q-statement' }), opts.el);
  return {
    el,
    response: () => (opts.response() === undefined ? undefined : opts.response() === 0),
    setResponse: (v) => opts.setResponse(v ? 0 : 1),
    reveal: () => opts.reveal(q.answer ? 0 : 1),
  };
}

function wordbank(q, step, onChange) {
  const slot = h('span', { class: 'slot', 'aria-live': 'polite' }, h('span', { class: 'slot-empty' }, 'choose a word'));
  const opts = optionList(q.options, step, (i) => {
    slot.innerHTML = formatText(q.options[i].text);
    slot.classList.add('filled');
    onChange(i);
  }, { keepOrder: q.keepOrder, cls: 'options options-chips' });
  const sentence = h('p', { class: 'q-sentence', dir: q.rtl ? 'rtl' : 'ltr', lang: q.rtl ? 'he' : null },
    h('span', { html: formatText(q.before) }), slot, h('span', { html: formatText(q.after) }));
  if (q.rtl) sentence.classList.add('he');
  const el = h('div', { class: 'q q-wordbank' }, promptEl(q.prompt || 'Choose the word that completes the sentence.'), sentence, opts.el);
  return {
    ...opts,
    el,
    reveal() {
      const want = correctResponse(q);
      opts.reveal(want);
      slot.classList.add(opts.response() === want ? 'right' : 'wrong');
    },
  };
}

function predict(q, step, onChange) {
  const sum = h('div', { class: 'q-predict he', dir: 'rtl', lang: 'he' });
  q.parts.forEach((p, i) => {
    if (i) sum.append(h('span', { class: 'op', 'aria-hidden': 'true' }, '+'));
    sum.append(h('span', { class: 'part' }, p));
  });
  sum.append(h('span', { class: 'op', 'aria-hidden': 'true' }, '='), h('span', { class: 'part unknown' }, '?'));
  const opts = optionList(q.options, step, onChange, { keepOrder: q.keepOrder });
  const el = h('div', { class: 'q q-predict-wrap' }, promptEl(q.prompt || 'What do these combine to make?'), sum, opts.el);
  return { ...opts, el, reveal: () => opts.reveal(correctResponse(q)) };
}

// --- tap the letters -----------------------------------------------------------

function tap(q, step, onChange) {
  const picked = new Set();
  const buttons = [];
  const tokens = splitHebrew(q.he);
  const total = tokens.filter((t) => t.kind === 'letter').length;
  const row = h('div', { class: 'tap-row he', dir: 'rtl', lang: 'he', role: 'group', 'aria-label': 'Letters' });
  // Letters of one word stay together; lines only break between words.
  let wordEl = null;
  for (const t of tokens) {
    if (t.kind !== 'letter') {
      wordEl = null;
      if (t.text.trim()) row.append(h('span', { class: 'tap-sep', 'aria-hidden': 'true' }, t.text));
      continue;
    }
    if (!wordEl) { wordEl = h('span', { class: 'tap-word' }); row.append(wordEl); }
    const b = h('button', {
      type: 'button', class: 'letter', 'aria-pressed': 'false',
      'aria-label': `${t.text}, letter ${t.index + 1} of ${total}`,
    }, t.text);
    b.addEventListener('click', () => toggle(t.index));
    buttons[t.index] = b;
    wordEl.append(b);
  }
  function toggle(i, silent) {
    if (picked.has(i)) picked.delete(i); else picked.add(i);
    buttons[i].setAttribute('aria-pressed', String(picked.has(i)));
    if (!silent) onChange([...picked]);
  }
  const legend = h('p', { class: 'legend', hidden: true },
    h('span', { class: 'key key-right' }, `${RIGHT} right`), ' ',
    h('span', { class: 'key key-wrong' }, `${WRONG} wrong`), ' ',
    h('span', { class: 'key key-missed' }, 'dashed: missed'));
  const el = h('div', { class: 'q q-tap' }, promptEl(q.prompt), row, h('p', { class: 'hint' }, 'Tap again to undo.'), legend);
  return {
    el,
    response: () => (picked.size ? [...picked].sort((a, b) => a - b) : undefined),
    setResponse(arr) { for (const i of arr) toggle(i, true); onChange([...picked]); },
    reveal() {
      const want = new Set(correctResponse(q));
      buttons.forEach((b, i) => {
        b.disabled = true;
        const sel = picked.has(i);
        if (sel && want.has(i)) { b.classList.add('right'); b.setAttribute('aria-label', `${b.textContent}, ${RIGHT} correct`); }
        else if (sel) { b.classList.add('wrong'); b.setAttribute('aria-label', `${b.textContent}, ${WRONG} should not be chosen`); }
        else if (want.has(i)) { b.classList.add('missed'); b.setAttribute('aria-label', `${b.textContent}, missed`); }
      });
      legend.hidden = false;
      el.querySelector('.hint')?.remove();
    },
  };
}

// --- matching ------------------------------------------------------------------

function match(q, step, onChange) {
  const n = q.pairs.length;
  if (!step.order) step.order = shuffledIndexes(n);
  const pairOf = new Array(n).fill(undefined); // left -> right
  let activeLeft;
  const leftBtns = [];
  const rightBtns = [];

  const leftCol = h('div', { class: 'match-col', role: 'group', 'aria-label': 'Items' });
  const rightCol = h('div', { class: 'match-col', role: 'group', 'aria-label': 'Matches' });
  q.pairs.forEach((p, i) => {
    const b = h('button', { type: 'button', class: 'option match-item', 'aria-pressed': 'false' },
      h('span', { class: 'badge', 'aria-hidden': 'true' }), h('span', { class: 'option-text', html: formatText(p.left) }));
    b.addEventListener('click', () => clickLeft(i));
    leftBtns[i] = b;
    leftCol.append(b);
  });
  for (const j of step.order) {
    const b = h('button', { type: 'button', class: 'option match-item', 'aria-pressed': 'false', 'data-i': j },
      h('span', { class: 'badge', 'aria-hidden': 'true' }), h('span', { class: 'option-text', html: formatText(q.pairs[j].right) }));
    b.addEventListener('click', () => clickRight(j));
    rightBtns[j] = b;
    rightCol.append(b);
  }

  function clickLeft(i) {
    if (pairOf[i] !== undefined) pairOf[i] = undefined; // tapping a paired item undoes the pair
    activeLeft = i;
    paint();
  }
  function clickRight(j) {
    const owner = pairOf.indexOf(j);
    if (owner !== -1) { pairOf[owner] = undefined; paint(); return; }
    if (activeLeft === undefined) {
      status.textContent = 'Choose an item on the left first.';
      return;
    }
    pairOf[activeLeft] = j;
    activeLeft = pairOf.findIndex((v) => v === undefined);
    if (activeLeft === -1) activeLeft = undefined;
    paint();
  }
  function paint() {
    status.textContent = '';
    leftBtns.forEach((b, i) => {
      const num = pairOf[i] !== undefined ? String(i + 1) : '';
      b.querySelector('.badge').textContent = num;
      b.classList.toggle('paired', pairOf[i] !== undefined);
      b.setAttribute('aria-pressed', String(activeLeft === i));
      b.setAttribute('aria-label', `${b.querySelector('.option-text').textContent}${num ? `, paired as ${num}` : ''}`);
    });
    rightBtns.forEach((b, j) => {
      const owner = pairOf.indexOf(j);
      const num = owner !== -1 ? String(owner + 1) : '';
      b.querySelector('.badge').textContent = num;
      b.classList.toggle('paired', owner !== -1);
      b.setAttribute('aria-pressed', String(owner !== -1));
      b.setAttribute('aria-label', `${b.querySelector('.option-text').textContent}${num ? `, paired as ${num}` : ''}`);
    });
    onChange(pairOf.every((v) => v !== undefined) ? [...pairOf] : undefined);
  }

  const status = h('p', { class: 'hint', 'aria-live': 'polite' });
  const answers = h('ol', { class: 'match-answers', hidden: true });
  const el = h('div', { class: 'q q-match' },
    promptEl(q.prompt || 'Match each item on the left with one on the right.'),
    h('p', { class: 'hint' }, 'Tap an item on the left, then its match on the right. Tap a pair again to undo.'),
    h('div', { class: 'match-grid' }, leftCol, rightCol), status, answers);
  queueMicrotask(paint);
  return {
    el,
    response: () => (pairOf.every((v) => v !== undefined) ? [...pairOf] : undefined),
    setResponse(arr) { arr.forEach((j, i) => { pairOf[i] = j; }); activeLeft = undefined; paint(); },
    reveal() {
      [...leftBtns, ...rightBtns].forEach((b) => { b.disabled = true; });
      el.querySelectorAll('.hint').forEach((x) => x.remove());
      q.pairs.forEach((p, i) => {
        const ok = pairOf[i] === i;
        leftBtns[i].classList.add(ok ? 'right' : 'wrong');
        answers.append(h('li', { class: ok ? 'right' : 'wrong' },
          h('span', { class: 'mark' }, ok ? RIGHT : WRONG), ' ',
          h('span', { html: formatText(p.left) }), ' → ', h('span', { html: formatText(p.right) })));
      });
      answers.hidden = false;
    },
  };
}

// --- word breakdown --------------------------------------------------------------

function breakdown(q, step, onChange) {
  const tokens = splitHebrew(q.he).filter((t) => t.kind === 'letter');
  const picked = new Set();
  const gapBtns = [];
  const row = h('div', { class: 'split-row he', dir: 'rtl', lang: 'he', role: 'group', 'aria-label': 'Places to split the word' });
  tokens.forEach((t, i) => {
    row.append(h('span', { class: 'split-letter' }, t.text));
    if (i < tokens.length - 1) {
      const b = h('button', { type: 'button', class: 'gap', 'aria-pressed': 'false', 'aria-label': `Split after letter ${i + 1} (${t.text})` },
        h('span', { class: 'gap-line', 'aria-hidden': 'true' }));
      b.addEventListener('click', () => toggle(i));
      gapBtns[i] = b;
      row.append(b);
    }
  });
  function toggle(i, silent) {
    if (picked.has(i)) picked.delete(i); else picked.add(i);
    gapBtns[i].setAttribute('aria-pressed', String(picked.has(i)));
    if (!silent) onChange(picked.size ? [...picked] : undefined);
  }
  const partsEl = h('div', { class: 'parts', dir: 'rtl', hidden: true },
    q.parts.map((p) => h('div', { class: 'part-card' },
      h('span', { class: 'he part-he', lang: 'he', dir: 'rtl' }, p.he),
      h('span', { class: 'part-label', dir: 'auto', html: formatText(p.label) }))));
  const el = h('div', { class: 'q q-breakdown' },
    promptEl(q.prompt || 'Tap where this word splits into its parts.'), row,
    h('p', { class: 'hint' }, 'Tap the space between two letters. Tap again to undo.'), partsEl);
  return {
    el,
    response: () => (picked.size ? [...picked].sort((a, b) => a - b) : undefined),
    setResponse(arr) { for (const i of arr) toggle(i, true); onChange([...picked]); },
    reveal() {
      const want = new Set(gapsForParts(q.parts.map((p) => p.he)));
      gapBtns.forEach((b, i) => {
        b.disabled = true;
        if (picked.has(i) && want.has(i)) b.classList.add('right');
        else if (picked.has(i)) b.classList.add('wrong');
        else if (want.has(i)) b.classList.add('missed');
      });
      el.querySelector('.hint')?.remove();
      partsEl.hidden = false;
    },
  };
}

const RENDERERS = { choice, truefalse, wordbank, predict, tap, match, breakdown };

const RENDERER_TYPES = Object.keys(RENDERERS);

// ---- ui.js ----
// Screens: home, lesson (teach / check / test / challenge / results), review,
// progress, settings.






const STAR = '★'; // ★
const TICK = '✓'; // ✓
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

// --- shared chrome ---------------------------------------------------------------

function siteHeader() {
  return h('header', { class: 'site-bar' },
    h('a', { class: 'brand', href: '#/' }, 'Dikduk'),
    h('nav', { class: 'bar-nav', 'aria-label': 'Main' },
      h('a', { class: 'bar-link', href: '#/progress' }, 'Progress'),
      h('a', { class: 'bar-link', href: '#/settings' }, 'Settings')));
}

function heTitle(lesson) {
  return lesson.hebrewTitle ? h('span', { class: 'he', lang: 'he', dir: 'rtl' }, lesson.hebrewTitle) : null;
}

function statusLine(entry, lesson) {
  if (!entry || !entry.completed) return h('span', { class: 'status status-todo' }, 'Not started');
  const bits = [h('span', { class: 'status status-done' }, `${TICK} Complete`)];
  if (entry.bestTest !== null) bits.push(h('span', { class: 'status' }, `best ${entry.bestTest}%`));
  if (entry.star) bits.push(h('span', { class: 'status status-star' }, `${STAR} Challenge`));
  else if (lesson.challenge?.length && entry.bestChallenge !== null) bits.push(h('span', { class: 'status' }, `challenge best ${entry.bestChallenge}%`));
  return bits;
}

function continueTarget(lessons, save) {
  const last = lessons.find((l) => l.id === save.last);
  if (last && !save.lessons[last.id]?.completed) return { lesson: last, verb: 'Continue' };
  const next = lessons.find((l) => !save.lessons[l.id]?.completed);
  if (!next) return null;
  return { lesson: next, verb: Object.keys(save.lessons).length ? 'Next' : 'Start' };
}

// --- lesson ----------------------------------------------------------------------

function renderLesson(app, ctx, lessonId, mode) {
  const lesson = ctx.lessons.find((l) => l.id === lessonId);
  if (!lesson) return renderMissing(app, ctx);
  if (mode === 'challenge' && !lesson.challenge?.length) { location.hash = `#/lesson/${lesson.id}`; return; }

  ctx.save.last = lesson.id;
  ctx.persist();
  runScreen(app, ctx, buildRun(lesson, mode), {
    title: [lesson.title, mode === 'challenge' ? ' · Challenge' : ''],
    lessonOf: () => lesson,
    intro: (step) => introView(lesson, step),
    results: (run) => resultsView(lesson, run, ctx),
  });
}

// --- review ----------------------------------------------------------------------

function renderReview(app, ctx) {
  const keys = reviewPool(ctx.save, ctx.lessons);
  if (!keys.length) {
    clear(app).append(siteHeader(), h('main', { id: 'main', class: 'page' },
      h('h1', { tabindex: '-1' }, 'Review'),
      h('p', {}, 'Nothing to review. Questions you answer wrongly in any lesson are kept here, so you can try them again later.'),
      h('p', {}, h('a', { class: 'button', href: '#/' }, 'All lessons'))), footer());
    focusEl(app.querySelector('h1'));
    return;
  }
  const byId = new Map(ctx.lessons.map((l) => [l.id, l]));
  runScreen(app, ctx, buildReviewRun(ctx.lessons, keys), {
    title: ['Review'],
    lessonOf: (step) => byId.get(step.lessonId),
    intro: (step) => reviewIntroView(step, keys.length),
    results: (run) => reviewResultsView(run, ctx, byId),

}

function reviewResultsView(run, ctx, byId) {
  const s = scoreRun(run);
  const left = reviewPool(ctx.save, ctx.lessons).length;
  return h('section', { class: 'results' },
    h('h2', { tabindex: '-1' }, 'Review finished'),
    h('p', { class: 'score' }, h('span', { class: 'score-big' }, `${s.right} of ${s.total}`), ` (${s.pct}%)`),
    h('p', {}, left ? `${plural(left, 'question')} still on your review list.` : `${TICK} Your review list is clear.`),
    missedList(s.missedSteps.map((st) => ({ q: st.q, from: byId.get(st.lessonId)?.title }))),
    h('div', { class: 'actions' },
      left ? h('a', { class: 'button primary', href: '#/review', onclick: rerun }, 'Review again') : null,
      h('a', { class: left ? 'button' : 'button primary', href: '#/' }, 'All lessons')));
}

// --- running a lesson or a review --------------------------------------------------

// opts: title (array of strings), lessonOf(step), intro(step), results(run).
function runScreen(app, ctx, run, opts) {
  let view = null; // current question view

  const bar = h('div', { class: 'progress', role: 'progressbar', 'aria-label': 'Progress', 'aria-valuemin': '0', 'aria-valuemax': '100' },
    h('div', { class: 'progress-fill' }));
  const stage = h('main', { id: 'main', class: 'page lesson-page' });
  const back = h('button', { type: 'button', class: 'button', onclick: () => go(run.index - 1) }, 'Back');
  const primary = h('button', { type: 'button', class: 'button primary' });
  const nav = h('footer', { class: 'lesson-nav' }, back, primary);

  clear(app).append(
    h('header', { class: 'site-bar lesson-bar' },
      h('a', { class: 'bar-link', href: '#/' }, '← Lessons'),
      h('span', { class: 'bar-title' }, ...opts.title),
      bar),
    stage, nav);

  primary.addEventListener('click', onPrimary);

  function go(i) {
    run.index = Math.max(0, Math.min(run.steps.length - 1, i));
    draw();
  }

  function onPrimary() {
    const step = run.steps[run.index];
    if (step.kind === 'question' && !run.answers[stepKey(step)]) {
      const response = view.response();
      if (response === undefined) return;
      const correct = answer(run, step, response);
      noteAnswer(ctx.save, opts.lessonOf(step).id, step.q.id, correct);
      ctx.persist();
      showFeedback(step, correct, true);
      return;
    }
    if (canAdvance(run)) go(run.index + 1);
  }

  function showFeedback(step, correct, moveFocus) {
    view.reveal();
    const fb = stage.querySelector('.feedback');
    fb.hidden = false;
    fb.className = `feedback ${correct ? 'is-right' : 'is-wrong'}`;
    clear(fb).append(
      h('p', { class: 'verdict' }, correct ? `${TICK} Correct` : '✗ Not quite'),
      textEl('p', step.q.explain, { class: 'explain' }));
    markTrop(fb);
    setPrimary();
    if (moveFocus) focusEl(fb);
  }

  function setPrimary() {
    const step = run.steps[run.index];
    const last = run.steps[run.index + 1]?.kind === 'results';
    nav.hidden = step.kind === 'results';
    back.disabled = run.index === 0;
    primary.disabled = false;
    if (step.kind === 'teach') primary.textContent = 'Next';
    else if (step.kind === 'intro') primary.textContent = { challenge: 'Start the challenge', review: 'Start the review' }[step.phase] || 'Start the test';
    else if (step.kind === 'question') {
      if (run.answers[stepKey(step)]) primary.textContent = last ? 'See results' : 'Continue';
      else { primary.textContent = 'Check'; primary.disabled = view?.response() === undefined; }
    }
  }

  function draw() {
    const step = run.steps[run.index];
    const pct = Math.round(progressFraction(run) * 100);
    bar.setAttribute('aria-valuenow', String(pct));
    bar.firstChild.style.width = `${pct}%`;
    clear(stage);
    view = null;
    if (step.kind === 'teach') stage.append(teachView(step.screen));
    else if (step.kind === 'intro') stage.append(opts.intro(step));
    else if (step.kind === 'question') stage.append(questionView(step));
    else if (step.kind === 'results') stage.append(opts.results(run));
    markTrop(stage);
    setPrimary();
    window.scrollTo(0, 0);
    focusEl(stage.querySelector('h2, h1'));
  }

  function questionView(step) {
    const qs = run.steps.filter((s) => s.kind === 'question' && s.phase === step.phase);
    const n = qs.indexOf(step) + 1;
    const label = step.phase === 'check' ? 'Quick check'
      : `${{ challenge: 'Challenge', review: 'Review' }[step.phase] || 'Test'} · question ${n} of ${qs.length}`;
    const from = step.phase === 'review' ? opts.lessonOf(step) : null;
    view = renderQuestion(step, () => setPrimary());
    const wrap = h('section', { class: `question phase-${step.phase}` },
      h('h2', { class: 'phase-label', tabindex: '-1' }, label),
      from ? h('p', { class: 'from-lesson' }, `From lesson ${ctx.lessons.indexOf(from) + 1}: ${from.title}`) : null,
      view.el,
      h('div', { class: 'feedback', hidden: true, 'aria-live': 'polite' }));
    const prior = run.answers[stepKey(step)];
    if (prior) {
      view.setResponse(prior.response);
      queueMicrotask(() => showFeedback(step, prior.correct, false));
    }
    return wrap;
  }

  draw();
}

function teachView(screen) {
  return h('article', { class: 'teach' },
    h('h2', { tabindex: '-1' }, screen.heading),
    screen.body.map((p) => textEl('p', p)),
    screen.examples?.length ? h('ul', { class: 'examples' }, screen.examples.map((ex) => h('li', { class: 'example' },
      h('span', { class: 'example-he' }, hebrewWithMarks(ex.he, ex)),
      ex.note ? textEl('span', ex.note, { class: 'example-note' }) : null))) : null,
    screen.table ? h('div', { class: 'table-wrap' }, h('table', {},
      h('thead', {}, h('tr', {}, screen.table.headers.map((c) => textEl('th', c, { scope: 'col' })))),
      h('tbody', {}, screen.table.rows.map((r) => h('tr', {}, r.map((c) => textEl('td', c))))))) : null,
    calloutsOf(screen).map((c) => h('aside', { class: `callout callout-${c.kind}` },
      h('strong', {}, c.kind === 'tip' ? 'Try this' : 'Note'), ' ', h('span', { html: formatText(c.text) }))));
}

function calloutsOf(screen) {
  if (!screen.callout) return [];
  return Array.isArray(screen.callout) ? screen.callout : [screen.callout];
}

function introView(lesson, step) {
  const challenge = step.phase === 'challenge';
  return h('section', { class: 'intro-step' },
    h('h2', { tabindex: '-1' }, challenge ? 'Challenge' : 'Test'),
    h('p', {}, challenge
      ? `${step.count} harder questions that ask you to apply the rules. Score ${STAR_THRESHOLD}% or more to earn a star.`
      : `${step.count} questions on ${lesson.title}. Finishing them completes the lesson, whatever your score.`),
    h('p', { class: 'hint' }, 'Each answer is explained as you go.'));
}

function resultsView(lesson, run, ctx) {
  const s = scoreRun(run);
  if (!run.recorded) {
    recordResult(ctx.save, lesson.id, s.phase, s.pct);
    ctx.persist();
    run.recorded = true;
  }
  const entry = ctx.save.lessons[lesson.id];
  const next = nextLesson(ctx.lessons, lesson.id);
  const challenge = s.phase === 'challenge';
  const earnedStar = challenge && s.pct >= STAR_THRESHOLD;

  return h('section', { class: 'results' },
    h('h2', { tabindex: '-1' }, challenge ? 'Challenge finished' : `${TICK} ${lesson.title} complete`),
    h('p', { class: 'score' }, h('span', { class: 'score-big' }, `${s.right} of ${s.total}`), ` (${s.pct}%)`),
    challenge
      ? h('p', {}, earnedStar ? `${STAR} Star earned.` : `A star needs ${STAR_THRESHOLD}% or more.`, entry.bestChallenge !== null ? ` Best: ${entry.bestChallenge}%.` : '')
      : h('p', {}, `Best score: ${entry.bestTest}%.`),
    missedList(s.missed.map((q) => ({ q }))),
    h('div', { class: 'actions' },
      !challenge && lesson.challenge?.length ? h('a', { class: 'button primary', href: `#/lesson/${lesson.id}/challenge` }, entry.star ? `Retry the challenge` : 'Try the challenge') : null,
      challenge ? h('a', { class: 'button', href: `#/lesson/${lesson.id}/challenge`, onclick: rerun }, 'Try again') : null,
      next ? h('a', { class: next && (challenge || !lesson.challenge?.length) ? 'button primary' : 'button', href: `#/lesson/${next.id}` }, `Next: ${next.title}`) : null,
      h('a', { class: 'button', href: '#/' }, 'All lessons')));
}

// A same-hash link does not fire hashchange, so re-render explicitly.
function rerun(e) {
  if (location.hash === e.currentTarget.getAttribute('href')) {
    e.preventDefault();
    window.dispatchEvent(new HashChangeEvent('hashchange'));
  }
}

// items: [{ q, from? }], where from is the lesson title (in a review).
function missedList(items) {
  if (!items.length) return h('p', {}, 'Every answer right.');
  return h('section', { class: 'missed' },
    h('h3', {}, items.length === 1 ? 'The one to look at again' : `The ${items.length} to look at again`),
    h('ul', {}, items.map(({ q, from }) => h('li', {},
      from ? h('p', { class: 'from-lesson' }, from) : null,
      textEl('p', questionSummary(q), { class: 'missed-q' }),
      textEl('p', q.explain, { class: 'explain' })))));
}

function questionSummary(q) {
  switch (q.type) {
    case 'truefalse': return q.statement;
    case 'tap': return `${q.prompt} ${q.he}`;
    case 'breakdown': return `${q.prompt || 'Split the word'} ${q.he}`;
    case 'predict': return `${q.prompt || 'Combine'} ${q.parts.join(' + ')}`;
    case 'wordbank': return `${q.before}___${q.after}`;
    case 'match': return q.prompt || 'Matching';
    default: return [q.prompt, q.he].filter(Boolean).join(' ');
  }
}

function renderMissing(app) {
  clear(app).append(siteHeader(), h('main', { id: 'main', class: 'page' },
    h('h1', { tabindex: '-1' }, 'Not found'),
    h('p', {}, h('a', { href: '#/' }, 'Back to the lessons'))));
  focusEl(app.querySelector('h1'));
}

// ---- main.js ----
// Boot and routing. LESSONS is provided by build.py from src/lessons/*.js.
/* global LESSONS */





const THEME_COLOURS = { light: '#f5f5f0', dark: '#121212' };

function boot() {
  const lessons = sortLessons(typeof LESSONS !== 'undefined' ? LESSONS : []);
  for (const l of lessons) {
    const errors = validateLesson(l);
    if (errors.length) console.warn(`[dikduk] lesson problems:\n${errors.join('\n')}`);
  }

  const app = document.getElementById('app');
  const ctx = {
    lessons,
    save: loadSave(),
    persist() { writeSave(ctx.save); },
    applySettings() { applySettings(ctx.save.settings); },
  };
  ctx.applySettings();

  const dark = window.matchMedia?.('(prefers-color-scheme: dark)');
  dark?.addEventListener?.('change', () => ctx.applySettings());

  function route() {
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
    if (parts.length === 0) renderHome(app, ctx);
    else if (parts[0] === 'settings') renderSettings(app, ctx);
    else if (parts[0] === 'progress') renderProgress(app, ctx);
    else if (parts[0] === 'review') renderReview(app, ctx);
    else if (parts[0] === 'lesson' && parts[1]) renderLesson(app, ctx, parts[1], parts[2] === 'challenge' ? 'challenge' : 'lesson');
    else renderMissing(app, ctx);
  }
  window.addEventListener('hashchange', route);

  // The skip link must not change the hash, which would trigger the router.
  document.querySelector('.skip')?.addEventListener('click', (e) => {
    e.preventDefault();
    const main = document.getElementById('main');
    if (main) { main.setAttribute('tabindex', '-1'); main.focus(); }
  });

  route();
  registerServiceWorker();
}

// Offline support. Only on https (or a local test server), where browsers allow it.
function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  const local = ['localhost', '127.0.0.1'].includes(location.hostname);
  if (location.protocol !== 'https:' && !local) return;
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

function applySettings(settings) {
  const root = document.documentElement;
  root.dataset.theme = settings.theme;
  root.dataset.textSize = settings.textSize;
  const isDark = settings.theme === 'dark'
    || (settings.theme === 'auto' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? THEME_COLOURS.dark : THEME_COLOURS.light);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
